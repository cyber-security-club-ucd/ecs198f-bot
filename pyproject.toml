[project]
name = "ecs198f-bot"
version = "1.0.0"
description = "Discord bot for ECS 198F — authenticates students via Authentik and assigns roles"
requires-python = ">=3.14"
dependencies = [
    # Discord bot
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
    # Django web app
    "django>=5.1.14,<5.3",
    "django-cotton>=0.9",
    "django-stubs>=5.1.1",
    "pyjwt>=2.8.0",
    "gunicorn>=21.2",
    "whitenoise>=6.6",
    # Authentik integration
    "httpx>=0.28.1",
    # Shared
    "psycopg2-binary>=2.9.9",
    "asgiref>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-asyncio>=0.21",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bot", "web"]

[dependency-groups]
dev = [
    "ruff>=0.14.0",
    "pytest>=7.4",
    "pytest-django>=4.7",
    "pytest-asyncio>=0.21",
    "mypy>=1.13",
    "pytest-cov>=7.0.0",
    "django-stubs>=5.1.1",
]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
mypy_path = "web"
files = ["bot", "web/core", "web/team", "web/wccomps"]
exclude = "(/tests/|/test_|tests\\.py|conftest\\.py)"

warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_configs = true
warn_no_return = true
warn_return_any = true
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_any_explicit = true
disallow_subclassing_any = true
disallow_any_unimported = false
no_implicit_optional = true
no_implicit_reexport = true
strict_optional = true
strict_equality = true
extra_checks = true

show_error_codes = true
pretty = true
color_output = true
incremental = true
cache_dir = ".mypy_cache"
follow_imports = "normal"
ignore_missing_imports = false

[[tool.mypy.overrides]]
module = "psycopg2.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "wccomps.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "wccomps.settings"
pythonpath = ["web"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["bot/tests", "web/core/tests", "web/team/tests"]
addopts = ["--tb=short"]
markers = [
    "integration: Integration tests with real database and APIs",
]

[tool.ruff]
target-version = "py314"
line-length = 120
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "*.pyc",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "PIE", "SIM", "T10",
    "N", "Q", "S", "ASYNC", "DTZ", "PERF",
]
ignore = [
    "E402",   # module level import not at top (django.setup pattern)
    "DTZ007", # strptime without %z
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106", "S110", "S311"]
"**/test_*.py" = ["S101", "S105", "S106", "S110", "S311"]
"**/conftest.py" = ["S101", "S105", "S106", "S110", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "web", "core", "team", "wccomps"]

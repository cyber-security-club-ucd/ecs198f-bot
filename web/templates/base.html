<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ECS 198F Bot{% endblock %}</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 60px auto; padding: 0 20px; color: #333; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 24px; margin-top: 16px; }
        .error { background: #fff0f0; border-color: #ffcccc; }
        .success { background: #f0fff4; border-color: #9ae6b4; }
        .label { font-size: 0.8rem; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { margin: 2px 0 14px; }
        .muted { color: #666; font-size: 0.9rem; }
        a.btn { display: inline-block; margin-top: 16px; padding: 8px 16px; background: #2563eb; color: white; text-decoration: none; border-radius: 6px; font-size: 0.9rem; }
        a.btn:hover { background: #1d4ed8; }
    </style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
